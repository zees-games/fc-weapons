# A v* tag releases this repository: the addons/fc_weapons zip, and with `pack` the
# pack zip that carries addons/fc_weapons (its code) with the weapons data, which a
# host mounts as an add-on overlay. The whole job is in gamespice-platform/ci; its README
# says what the inputs are.
name: Release

on:
    push:
        tags: ['v*']

jobs:
    validate:
        uses: gamespice-platform/ci/.github/workflows/validate.yml@v1.4.0
        with:
            suite-timeout: 900
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}

    release:
        needs: validate
        uses: gamespice-platform/ci/.github/workflows/release.yml@v1.4.0
        permissions:
            contents: write
        with:
            pack: true
            pack-owned-addons: true
        secrets:
            DEPS_TOKEN: ${{ secrets.GS_DEPS_TOKEN }}
